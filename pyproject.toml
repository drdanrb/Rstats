[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rstatspython"
version = "0.1.0"
description = "Familiar commands. Complete statistical reports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Rstats contributors"}]
dependencies = [
  "numpy>=2.0", "pandas>=2.2,<4", "scipy>=1.16",
  "statsmodels>=0.14.4,<0.16", "patsy>=1.0",
  "pingouin>=0.6,<0.8", "seaborn>=0.13.2", "matplotlib>=3.9",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "python-pptx>=1"]

[project.urls]
Repository = "https://github.com/drdanrb/Rstats"

[tool.hatch.build.targets.wheel]
packages = ["src/rstats"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "tools", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning:rstats.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
